<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>文字コピペ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10141a;
    --panel: #171d26;
    --panel-2: #1e2530;
    --line: #2a3340;
    --ink: #e7edf3;
    --ink-dim: #8a97a8;
    --laser: #4fe3c1;
    --laser-dim: #2b7a6a;
    --warn: #f0a05a;
    --danger: #e2665a;
    --radius: 14px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #182030 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:'Space Grotesk', system-ui, sans-serif;
    min-height:100vh;
    padding: 20px 16px 60px;
  }
  .wrap{ max-width:480px; margin:0 auto; }

  header{ text-align:center; margin-bottom:18px; }
  header .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--laser);
    text-transform:uppercase;
  }
  header h1{
    font-size:22px;
    font-weight:700;
    margin:4px 0 2px;
  }
  header p{
    font-size:12.5px;
    color:var(--ink-dim);
    margin:0;
  }

  .source-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:14px;
  }
  .source-btn{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:10px;
    padding:12px 6px;
    font-family:'Space Grotesk', sans-serif;
    font-size:12.5px;
    font-weight:600;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
    transition:border-color .15s, transform .1s;
  }
  .source-btn:active{ transform:scale(.97); }
  .source-btn:hover{ border-color:var(--laser-dim); }
  .source-btn svg{ width:20px; height:20px; stroke:var(--laser); }

  /* viewfinder */
  .viewfinder{
    position:relative;
    background:var(--panel);
    border-radius:var(--radius);
    border:1px solid var(--line);
    aspect-ratio: 4/3;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:14px;
  }
  .viewfinder img{
    width:100%; height:100%; object-fit:contain;
    background:#0b0e13;
  }
  .viewfinder .empty{
    color:var(--ink-dim);
    font-size:12.5px;
    text-align:center;
    padding:0 30px;
    font-family:'JetBrains Mono',monospace;
  }
  .corner{
    position:absolute;
    width:22px; height:22px;
    border-color:var(--laser);
    opacity:.85;
  }
  .corner.tl{ top:8px; left:8px; border-top:2px solid; border-left:2px solid; border-radius:4px 0 0 0;}
  .corner.tr{ top:8px; right:8px; border-top:2px solid; border-right:2px solid; border-radius:0 4px 0 0;}
  .corner.bl{ bottom:8px; left:8px; border-bottom:2px solid; border-left:2px solid; border-radius:0 0 0 4px;}
  .corner.br{ bottom:8px; right:8px; border-bottom:2px solid; border-right:2px solid; border-radius:0 0 4px 0;}

  .scanline{
    position:absolute; left:0; right:0; top:0;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--laser), transparent);
    box-shadow:0 0 12px 2px var(--laser);
    opacity:0;
  }
  .viewfinder.scanning .scanline{
    opacity:1;
    animation: scan 1.6s linear infinite;
  }
  @keyframes scan{
    0%{ top:6%; }
    50%{ top:92%; }
    100%{ top:6%; }
  }

  .controls-row{
    display:flex; gap:8px; margin-bottom:18px;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:10px;
    padding:13px 10px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .btn.primary{
    background:var(--laser);
    color:#08201b;
  }
  .btn.primary:disabled{
    background:#2b3945; color:#5b6b78; cursor:not-allowed;
  }
  .btn.ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-dim);
    flex:0 0 auto;
    padding:13px 14px;
  }

  .opt-row{
    display:flex; align-items:center; justify-content:space-between;
    margin: -6px 0 14px;
    font-size:12px;
    color:var(--ink-dim);
    font-family:'JetBrains Mono',monospace;
  }
  .opt-row select{
    background:var(--panel-2);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:6px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    padding:4px 6px;
  }

  .status{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--laser);
    min-height:16px;
    margin-bottom:6px;
  }

  /* result card */
  .card{
    background:linear-gradient(155deg,#1b2330,#141a22);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 16px;
    margin-bottom:16px;
    display:none;
  }
  .card.show{ display:block; }
  .card .label{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    color:var(--ink-dim);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .card input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px dashed var(--line);
    color:var(--ink);
    font-family:'JetBrains Mono',monospace;
    font-size:22px;
    font-weight:700;
    letter-spacing:.05em;
    padding:6px 0 10px;
    outline:none;
  }
  .card input:focus{ border-bottom-color:var(--laser); }

  .chips{
    display:flex; flex-wrap:wrap; gap:6px;
    margin:12px 0 4px;
  }
  .chip{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--ink-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    padding:5px 9px;
    border-radius:20px;
    cursor:pointer;
  }
  .chip:hover{ border-color:var(--laser-dim); color:var(--ink); }

  .card-actions{
    display:flex; gap:8px; margin-top:14px;
  }

  details.raw{
    margin-top:12px;
    font-size:11.5px;
    color:var(--ink-dim);
  }
  details.raw summary{ cursor:pointer; font-family:'JetBrains Mono',monospace; }
  details.raw pre{
    white-space:pre-wrap;
    word-break:break-all;
    background:#0d1117;
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px;
    margin-top:6px;
    font-family:'JetBrains Mono',monospace;
  }

  /* history */
  .history-head{
    display:flex; align-items:center; justify-content:space-between;
    margin: 22px 0 8px;
  }
  .history-head h2{
    font-size:13px; margin:0;
    font-family:'JetBrains Mono',monospace;
    letter-spacing:.1em;
    color:var(--ink-dim);
    text-transform:uppercase;
  }
  .history-head button{
    background:none; border:none;
    color:var(--ink-dim);
    font-size:11.5px;
    font-family:'JetBrains Mono',monospace;
    cursor:pointer;
    text-decoration:underline;
  }
  .history-list{ display:flex; flex-direction:column; gap:6px; }
  .history-item{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:9px;
    padding:9px 11px;
  }
  .history-item .num{
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
  }
  .history-item .ts{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    color:var(--ink-dim);
    display:block;
    margin-top:2px;
  }
  .history-item .actions{ display:flex; gap:10px; }
  .history-item button{
    background:none; border:none; color:var(--ink-dim); cursor:pointer;
    font-size:15px; line-height:1;
  }
  .history-item button.copy{ color:var(--laser); }
  .history-empty{
    color:var(--ink-dim); font-size:12px; text-align:center; padding:14px 0;
    font-family:'JetBrains Mono',monospace;
  }

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--laser); color:#08201b; font-weight:700;
    font-size:13px; padding:10px 18px; border-radius:30px;
    opacity:0; transition:opacity .2s, transform .2s;
    pointer-events:none;
    font-family:'Space Grotesk',sans-serif;
    z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  input[type=file]{ display:none; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">TEXT COPY & PASTE</div>
    <h1>文字コピペ</h1>
    <p>カメラ・画像・スクショから文字を読み取ってコピー</p>
  </header>

  <div class="source-row">
    <button class="source-btn" id="btnCamera">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      カメラ
    </button>
    <button class="source-btn" id="btnLibrary">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      画像選択
    </button>
    <button class="source-btn" id="btnPaste">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
      貼り付け
    </button>
  </div>

  <input type="file" id="fileCamera" accept="image/*" capture="environment">
  <input type="file" id="fileLibrary" accept="image/*">

  <div class="viewfinder" id="viewfinder">
    <div class="empty" id="vfEmpty">上のボタンで対象の画像を読み込むか、<br>スクリーンショットをコピーして<br>「貼り付け」でCtrl+V / Cmd+V</div>
    <img id="vfImg" style="display:none;">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="scanline"></div>
  </div>

  <div class="opt-row">
    <span>認識モード</span>
    <select id="modeSelect">
      <option value="digits">数字のみ(高精度・推奨)</option>
      <option value="alnum">英数字</option>
      <option value="all">制限なし</option>
    </select>
  </div>

  <div class="controls-row">
    <button class="btn primary" id="btnScan" disabled>文字を読み取る</button>
    <button class="btn ghost" id="btnClear">クリア</button>
  </div>

  <div class="status" id="status"></div>

  <div class="card" id="resultCard">
    <div class="label">読み取り結果(編集できます)</div>
    <input type="text" id="resultInput" placeholder="文字がここに入ります" inputmode="text">
    <div class="chips" id="chips"></div>
    <div class="card-actions">
      <button class="btn primary" id="btnCopy">コピーする</button>
      <button class="btn ghost" id="btnSaveHistory">履歴に保存</button>
    </div>
    <details class="raw">
      <summary>認識された全テキストを見る</summary>
      <pre id="rawText"></pre>
    </details>
  </div>

  <div class="history-head">
    <h2>履歴</h2>
    <button id="btnClearHistory">全て削除</button>
  </div>
  <div class="history-list" id="historyList"></div>

</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(function(){
  const vf = document.getElementById('viewfinder');
  const vfImg = document.getElementById('vfImg');
  const vfEmpty = document.getElementById('vfEmpty');
  const btnScan = document.getElementById('btnScan');
  const btnClear = document.getElementById('btnClear');
  const btnCamera = document.getElementById('btnCamera');
  const btnLibrary = document.getElementById('btnLibrary');
  const btnPaste = document.getElementById('btnPaste');
  const fileCamera = document.getElementById('fileCamera');
  const fileLibrary = document.getElementById('fileLibrary');
  const statusEl = document.getElementById('status');
  const resultCard = document.getElementById('resultCard');
  const resultInput = document.getElementById('resultInput');
  const chipsEl = document.getElementById('chips');
  const rawTextEl = document.getElementById('rawText');
  const btnCopy = document.getElementById('btnCopy');
  const btnSaveHistory = document.getElementById('btnSaveHistory');
  const historyList = document.getElementById('historyList');
  const btnClearHistory = document.getElementById('btnClearHistory');
  const toast = document.getElementById('toast');
  const modeSelect = document.getElementById('modeSelect');

  let currentImageData = null; // dataURL

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 1600);
  }

  function setImage(dataUrl){
    currentImageData = dataUrl;
    vfImg.src = dataUrl;
    vfImg.style.display = 'block';
    vfEmpty.style.display = 'none';
    btnScan.disabled = false;
    resultCard.classList.remove('show');
    statusEl.textContent = '';
  }

  function fileToDataUrl(file){
    return new Promise((resolve, reject)=>{
      if(!file){ reject(new Error('no file')); return; }
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  btnCamera.addEventListener('click', ()=> fileCamera.click());
  btnLibrary.addEventListener('click', ()=> fileLibrary.click());

  fileCamera.addEventListener('change', async (e)=>{
    const f = e.target.files[0];
    if(f){ setImage(await fileToDataUrl(f)); }
    fileCamera.value = '';
  });
  fileLibrary.addEventListener('change', async (e)=>{
    const f = e.target.files[0];
    if(f){ setImage(await fileToDataUrl(f)); }
    fileLibrary.value = '';
  });

  btnPaste.addEventListener('click', async ()=>{
    // Try modern clipboard API first (works on desktop Chrome/Edge, needs permission)
    if(navigator.clipboard && navigator.clipboard.read){
      try{
        const items = await navigator.clipboard.read();
        for(const item of items){
          const type = item.types.find(t => t.startsWith('image/'));
          if(type){
            const blob = await item.getType(type);
            const dataUrl = await fileToDataUrl(blob);
            setImage(dataUrl);
            showToast('画像を貼り付けました');
            return;
          }
        }
        showToast('クリップボードに画像が見つかりません');
      }catch(err){
        showToast('この端末では Ctrl+V / Cmd+V を直接お使いください');
      }
    } else {
      showToast('画面のどこかで Ctrl+V / Cmd+V を押してください');
    }
  });

  // Fallback: listen for native paste event (works on iOS Safari / Android Chrome too, after a tap+hold paste)
  document.addEventListener('paste', async (e)=>{
    const items = e.clipboardData && e.clipboardData.items;
    if(!items) return;
    for(const item of items){
      if(item.type.indexOf('image') !== -1){
        const blob = item.getAsFile();
        const dataUrl = await fileToDataUrl(blob);
        setImage(dataUrl);
        showToast('画像を貼り付けました');
        break;
      }
    }
  });

  btnClear.addEventListener('click', ()=>{
    currentImageData = null;
    vfImg.style.display = 'none';
    vfImg.src = '';
    vfEmpty.style.display = 'block';
    btnScan.disabled = true;
    resultCard.classList.remove('show');
    statusEl.textContent = '';
  });

  function extractCandidates(text){
    // Sequences of digits, optionally grouped with spaces / dashes / slashes
    const matches = text.match(/[0-9][0-9\-\s\/]{2,}[0-9]/g) || [];
    const cleaned = matches
      .map(m => m.trim())
      .filter(m => m.replace(/[^0-9]/g,'').length >= 4);
    // de-duplicate, keep order
    const seen = new Set();
    const out = [];
    for(const c of cleaned){
      const key = c.replace(/\s+/g,' ');
      if(!seen.has(key)){ seen.add(key); out.push(key); }
    }
    return out;
  }

  function getWhitelist(){
    const mode = modeSelect.value;
    if(mode === 'digits') return '0123456789-';
    if(mode === 'alnum') return 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-';
    return null; // no restriction
  }

  btnScan.addEventListener('click', async ()=>{
    if(!currentImageData) return;
    btnScan.disabled = true;
    vf.classList.add('scanning');
    statusEl.textContent = '読み取り中…';

    try{
      const params = { logger: m => {
        if(m.status && m.progress != null){
          statusEl.textContent = (m.status === 'recognizing text' ? '解析中' : m.status) + ' ' + Math.round(m.progress*100) + '%';
        }
      }};
      const worker = await Tesseract.createWorker('eng', 1, params);
      const whitelist = getWhitelist();
      if(whitelist){
        await worker.setParameters({ tessedit_char_whitelist: whitelist });
      }
      const { data } = await worker.recognize(currentImageData);
      await worker.terminate();

      const text = (data.text || '').trim();
      rawTextEl.textContent = text || '(テキストが検出されませんでした)';

      const candidates = extractCandidates(text);
      chipsEl.innerHTML = '';
      candidates.forEach(c=>{
        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.type = 'button';
        chip.textContent = c;
        chip.addEventListener('click', ()=>{ resultInput.value = c; });
        chipsEl.appendChild(chip);
      });

      resultInput.value = candidates[0] || '';
      resultCard.classList.add('show');
      statusEl.textContent = candidates.length
        ? `候補を ${candidates.length} 件検出しました`
        : '候補が見つかりませんでした。全テキストを確認するか、画像を撮り直してください';
    }catch(err){
      console.error(err);
      statusEl.textContent = '読み取りに失敗しました: ' + (err && err.message ? err.message : err);
    }finally{
      vf.classList.remove('scanning');
      btnScan.disabled = false;
    }
  });

  btnCopy.addEventListener('click', async ()=>{
    const val = resultInput.value.trim();
    if(!val){ showToast('コピーする文字がありません'); return; }
    try{
      await navigator.clipboard.writeText(val);
      showToast('コピーしました');
    }catch(err){
      resultInput.select();
      document.execCommand('copy');
      showToast('コピーしました');
    }
  });

  // ---- History ----
  const HISTORY_KEY = 'cardOcrHistoryV1';

  function loadHistory(){
    try{ return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveHistory(list){
    localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
  }
  function formatTs(ts){
    const d = new Date(ts);
    const p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function renderHistory(){
    const list = loadHistory();
    historyList.innerHTML = '';
    if(list.length === 0){
      historyList.innerHTML = '<div class="history-empty">まだ履歴はありません</div>';
      return;
    }
    list.slice().reverse().forEach(item=>{
      const row = document.createElement('div');
      row.className = 'history-item';
      row.innerHTML = `
        <div>
          <span class="num">${item.number}</span>
          <span class="ts">${formatTs(item.ts)}</span>
        </div>
        <div class="actions">
          <button class="copy" title="コピー">⧉</button>
          <button class="del" title="削除">✕</button>
        </div>
      `;
      row.querySelector('.copy').addEventListener('click', async ()=>{
        try{ await navigator.clipboard.writeText(item.number); showToast('コピーしました'); }
        catch(e){ showToast('コピーに失敗しました'); }
      });
      row.querySelector('.del').addEventListener('click', ()=>{
        const cur = loadHistory().filter(x => x.id !== item.id);
        saveHistory(cur);
        renderHistory();
      });
      historyList.appendChild(row);
    });
  }

  btnSaveHistory.addEventListener('click', ()=>{
    const val = resultInput.value.trim();
    if(!val){ showToast('保存する文字がありません'); return; }
    const list = loadHistory();
    list.push({ id: Date.now()+'-'+Math.random().toString(36).slice(2,7), number: val, ts: Date.now() });
    saveHistory(list);
    renderHistory();
    showToast('履歴に保存しました');
  });

  btnClearHistory.addEventListener('click', ()=>{
    if(confirm('履歴を全て削除しますか？')){
      saveHistory([]);
      renderHistory();
    }
  });

  renderHistory();
})();
</script>
</body>
</html>
