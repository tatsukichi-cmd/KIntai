<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ツール一覧</title>
<style>
  :root{
    --bg:#0f0f14;
    --surface:#1a1a24;
    --surface2:#22222f;
    --accent:#1db954;
    --accent-dim:#14803c;
    --text:#f2f2f5;
    --text-dim:#9a9aa8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:32px 16px;
  }
  .wrap{ width:100%; max-width:480px; }
  h1{ font-size:20px; font-weight:600; margin:0 0 4px; }
  .sub{ font-size:13px; color:var(--text-dim); margin:0 0 24px; }
  .card{
    display:block;
    background:var(--surface);
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:12px;
    text-decoration:none;
    color:var(--text);
    border:1px solid transparent;
    transition:border-color .15s, background .15s;
  }
  .card:hover{
    border-color:var(--accent);
    background:var(--surface2);
  }
  .card .name{
    font-size:16px;
    font-weight:600;
    margin-bottom:4px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card .name .arrow{
    color:var(--accent);
    font-size:14px;
  }
  .card .desc{
    font-size:13px;
    color:var(--text-dim);
    line-height:1.5;
  }
  .empty{
    font-size:13px;
    color:var(--text-dim);
    padding:24px 0;
    text-align:center;
  }
  .footer-note{
    font-size:11px;
    color:var(--text-dim);
    margin-top:24px;
    line-height:1.6;
  }
  code{
    background:var(--surface2);
    padding:1px 5px;
    border-radius:4px;
    font-size:11px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>ツール一覧</h1>
  <p class="sub">このページから各ツールに移動できます</p>
  <div id="list"></div>
  <div class="footer-note">
    ツールを追加するときは、このファイル内の <code>tools</code> 配列に1件追加するだけでOKです。
  </div>
</div>

<script>
/* ここに追加していく。url は同じリポジトリ内なら相対パスでもOK */
const tools = [
  {
    name: "タイムリマインダー",
    desc: "指定した時刻を常時表示（PiP）できるリマインダーツール",
    url: "time_reminder.html"
  },
  {
    name: "日付計算PWA",
    desc: "30/60/90日後計算・和暦変換",
    url: "days-calc/"
  },
  {
    name: "勤怠管理アプリ（個人用）",
    desc: "個人用の勤怠記録・集計アプリ",
    url: "kintai_02.html"
  },
  {
    name: "文字コピペ",
    desc: "カメラ・画像・スクショから文字を読み取ってコピー",
    url: "moji_copipe.html"
  }
];

const list = document.getElementById('list');

if(tools.length === 0){
  list.innerHTML = '<div class="empty">まだツールが登録されていません</div>';
} else {
  tools.forEach(t => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = t.url;
    a.innerHTML = `
      <div class="name">${t.name}<span class="arrow">→</span></div>
      <div class="desc">${t.desc}</div>
    `;
    list.appendChild(a);
  });
}
</script>
</body>
</html>
